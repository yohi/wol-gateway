services:
  wol-api:
    build:
      context: .
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=2).read()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      wol-api:
        condition: service_healthy
